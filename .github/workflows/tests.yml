name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installation:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, pdo_sqlite
          coverage: none
      - name: Verify required filesystem extension
        run: php --ri fileinfo
      - run: composer setup --no-interaction
      - run: composer check-platform-reqs
      - run: php artisan migrate:status
      - name: Remember the generated environment
        run: php -r "file_put_contents('.setup-env.sha256', hash_file('sha256', '.env'));"
      - name: Repeat setup without replacing the environment or key
        run: composer setup --no-interaction
      - name: Verify environment preservation
        run: >-
          php -r "exit(hash_equals(trim(file_get_contents('.setup-env.sha256')), hash_file('sha256', '.env')) ? 0 : 1);"
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bolum_test
          MYSQL_ROOT_PASSWORD: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptesting"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, pdo_sqlite, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - name: Exercise migrations with a legacy MySQL row-format default
        if: matrix.database == 'mysql'
        run: >-
          php -r '$db = new PDO("mysql:host=127.0.0.1;port=3306;dbname=bolum_test", "root", "testing"); $db->exec("SET GLOBAL innodb_default_row_format=COMPACT");'
      - run: php artisan test
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_DATABASE: ${{ matrix.database == 'mysql' && 'bolum_test' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: testing
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
